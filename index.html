<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A question for you</title>
<style>
:root{--bg:#2a0f24;--ink:#ffe8ef;--rose:#ff5c8a;--gold:#ffd27a;--mute:#cfa5b8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden;text-align:center}
main{width:100%;max-width:460px}
pre{font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;display:inline-block;margin:0;text-align:left;white-space:pre;line-height:1.15;font-size:clamp(15px,4.6vw,22px);color:var(--gold)}
h1{font-size:clamp(28px,8vw,38px);line-height:1.15;margin:22px 0 10px}
p{color:var(--mute);font-size:19px;line-height:1.4;margin:0 0 26px}
.hearts{display:flex;justify-content:center;gap:12px;height:40px;margin-bottom:10px}
.hearts span{font:700 24px ui-monospace,Menlo,Consolas,monospace;color:var(--rose);animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}
.bounce{animation:hop .8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;min-height:150px}
button{font:inherit;cursor:pointer;border-radius:999px;transition:font-size .25s,padding .25s}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.yes{background:var(--rose);color:#2a0f24;border:0;font-weight:700;font-size:calc(21px*var(--s,1));padding:.55em 1.5em}
a.yes{display:inline-block;text-decoration:none;cursor:pointer;border-radius:999px}
a.yes[hidden]{display:none}
.no{background:transparent;color:var(--ink);border:2px solid var(--mute);font-size:calc(18px*var(--n,1));padding:.5em 1.1em}
.heart{color:var(--rose);margin-top:14px}
.fly{position:fixed;pointer-events:none;z-index:10;font:700 24px ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){.hearts span,.bounce{animation:none}}
</style>
</head>
<body>
<main>
  <section id="ask">
    <div class="hearts" id="hearts" aria-hidden="true"></div>
    <pre id="who" aria-hidden="true"></pre>
    <h1 id="q">Will you go out with me?</h1>
    <p>Dinner, then a walk. You pick the place.</p>
    <div class="row" id="row">
      <button class="yes" id="yes">Yes</button>
      <button class="no" id="no">No</button>
    </div>
  </section>

  <section id="done" hidden>
    <h1>Yes!</h1>
    <pre id="dance" class="bounce" aria-hidden="true"></pre><br>
    <pre id="big" class="heart" aria-hidden="true"></pre>
    <p style="margin-top:22px">It's a date. Tell me when you're free.</p>
    <a id="text" class="yes" hidden>Text me</a>
  </section>

  <section id="ok" hidden>
    <pre aria-hidden="true">(^_^)/</pre>
    <h1>That's okay.</h1>
    <p>Thanks for hearing me out. Still friends?</p>
  </section>
</main>

<script>
// ---- Edit these two lines ----
var NAME = "";                       // her name, or leave empty. Also works as ?name=Sam on the link
var QUESTION = "Will you go out with me?";
var PHONE = "+16785719190";         // your number for the "Text me" button (empty hides the button)
var TOPIC = "ask-9f3k7q2mx4vz";      // ntfy topic: subscribe to this exact name in the ntfy app
// ------------------------------

var $ = function (id) { return document.getElementById(id); };
var param = new URLSearchParams(location.search).get("name");
var who = (param || NAME || "").trim();
$("q").textContent = who ? who + ", " + QUESTION.charAt(0).toLowerCase() + QUESTION.slice(1) : QUESTION;

function show(id) { ["ask", "done", "ok"].forEach(function (k) { $(k).hidden = k !== id; }); }

// Dancing row of ASCII hearts
for (var i = 0; i < 7; i++) {
  var s = document.createElement("span");
  s.textContent = "<3";
  s.style.animationDelay = (i * 0.12) + "s";
  $("hearts").appendChild(s);
}

// ASCII character asking
function figure(face) { return ["  " + face, " /(   )---<3", "   / \\"].join("\n"); }
$("who").textContent = figure("(^_^)");

// Sends a push notification to your phone via ntfy
function notify(msg) {
  try { fetch("https://ntfy.sh/" + TOPIC, { method: "POST", body: msg, keepalive: true }).catch(function () {}); } catch (e) {}
}
var her = who || "She";

// One No and it's done, with a kind exit
$("no").onclick = function () { notify(her + " said no. Be kind."); show("ok"); };



// Hearts flying out
function burst(x, y, count) {
  var glyphs = ["<3", "\u2665", "<3"], cols = ["#ff5c8a", "#ffd27a", "#ffb3c9"];
  for (var i = 0; i < count; i++) {
    var h = document.createElement("span");
    h.className = "fly";
    h.textContent = glyphs[i % 3];
    h.style.left = x + "px";
    h.style.top = y + "px";
    h.style.fontSize = (16 + Math.random() * 30) + "px";
    h.style.color = cols[i % 3];
    document.body.appendChild(h);
    var dx = (Math.random() - 0.5) * innerWidth * 1.1;
    var dy = -innerHeight * (0.5 + Math.random() * 0.9);
    var a = h.animate([
      { transform: "translate(-50%,-50%) scale(.4) rotate(0deg)", opacity: 1 },
      { transform: "translate(calc(-50% + " + dx + "px),calc(-50% + " + dy + "px)) scale(1.2) rotate(" + ((Math.random() - 0.5) * 90) + "deg)", opacity: 0 }
    ], { duration: 1800 + Math.random() * 1800, delay: Math.random() * 500, easing: "cubic-bezier(.2,.7,.3,1)", fill: "both" });
    a.onfinish = (function (el) { return function () { el.remove(); }; })(h);
  }
}

// Yes: hearts burst, two figures dance, hearts keep floating up
var frames = [
  ["\\(^o^)/  <3  \\(^o^)/", "  ( )          ( )", "  / \\          / \\"].join("\n"),
  ["/(^o^)\\  <3  /(^o^)\\", "  ( )          ( )", "  \\ /          \\ /"].join("\n")
];
var big = ["  ,d88b.d88b,", "  88888888888", "  `Y8888888Y'", "    `Y888Y'", "      `Y'"].join("\n");

$("yes").onclick = function () {
  var r = this.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 70);
  notify(her + " said YES!");
  if (PHONE) {
    $("text").href = "sms:" + PHONE + "?&body=" + encodeURIComponent("I said yes! What's the plan?");
    $("text").hidden = false;
  }
  show("done");
  $("big").textContent = big;
  var f = 0;
  $("dance").textContent = frames[0];
  setInterval(function () { f = 1 - f; $("dance").textContent = frames[f]; }, 400);
  setInterval(function () { burst(Math.random() * innerWidth, innerHeight + 10, 6); }, 1200);
};
</script>
</body>
</html>
